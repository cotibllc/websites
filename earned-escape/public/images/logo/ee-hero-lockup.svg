<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" fill="none" role="img" aria-label="Earned Escape">
  <defs>
    <linearGradient id="ee-hero-rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="72%" stop-color="#C9A84C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ee-hero-glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="160" cy="118" rx="130" ry="100" fill="url(#ee-hero-glow)"/>

  <!-- Seal -->
  <circle cx="160" cy="108" r="78" stroke="#C9A84C" stroke-width="1" opacity="0.28"/>
  <circle cx="160" cy="108" r="68" stroke="#C9A84C" stroke-width="0.5" opacity="0.12"/>
  <path d="M92 118 A68 68 0 0 1 228 118" stroke="#C9A84C" stroke-width="1.75" fill="none" opacity="0.85"/>
  <circle cx="160" cy="118" r="5" fill="#C9A84C" opacity="0.9"/>

  <text x="160" y="112" font-family="'Playfair Display', Georgia, serif" font-size="56" font-weight="400" font-style="italic" fill="#F8F5EE" text-anchor="middle" dominant-baseline="middle">Ee</text>

  <!-- Wordmark -->
  <text x="160" y="218" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="300" fill="#F8F5EE" text-anchor="middle" letter-spacing="0.12em">Earned</text>
  <line x1="48" y1="232" x2="272" y2="232" stroke="url(#ee-hero-rule)" stroke-width="1.25"/>
  <text x="160" y="262" font-family="'Montserrat', sans-serif" font-size="13" font-weight="300" fill="#C9A84C" text-anchor="middle" letter-spacing="0.72em">ESCAPE</text>
  <text x="160" y="286" font-family="'Montserrat', sans-serif" font-size="9" font-weight="400" fill="#F8F5EE" fill-opacity="0.45" text-anchor="middle" letter-spacing="0.28em">YOU'VE EARNED IT</text>
